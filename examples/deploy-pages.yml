# 配布先リポの .github/workflows/deploy.yml に置く見本（Pages）
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    uses: kajisho5/tower/.github/workflows/deploy-pages.yml@main
    with:
      project-name: sample-otter-site
      directory: dist
      build-command: npm run build
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
