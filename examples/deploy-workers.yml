# 配布先リポの .github/workflows/deploy.yml に置く見本（Workers）
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    uses: kajisho5/tower/.github/workflows/deploy-workers.yml@main
    with:
      build-command: npm run build   # ビルドが要らなければこの行を消す
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
