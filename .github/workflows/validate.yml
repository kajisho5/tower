# 設定ファイルの書き方とテストだけ確かめる（鍵は使わない。フォークからのプルリクエストでも安全）
name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 tools/tower.py validate
      - run: python3 -m unittest discover -s tests -v
