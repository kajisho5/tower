# projects/ の設定を Cloudflare と各リポに反映する
name: apply
on:
  push:
    branches: [main]
    paths: ["projects/**", "tools/**", ".github/workflows/apply.yml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "予定だけ表示して何も変えない"
        type: boolean
        default: false
concurrency: { group: tower, cancel-in-progress: false }
permissions: { contents: read, issues: write }
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: 反映
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.TOWER_GITHUB_TOKEN }}
          TOWER_PROBLEMS_FILE: ${{ runner.temp }}/problems.md
        run: python3 tools/tower.py apply ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: 失敗したら知らせる（Issue を作る）
        if: failure()
        uses: ./.github/actions/notify
        with:
          title: "tower: 反映に失敗しました"
          problems: ${{ runner.temp }}/problems.md
