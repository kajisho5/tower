# 各リポから呼び出す共通の Workers 公開ワークフロー
# 呼び出し方は examples/deploy-workers.yml を参照
name: deploy-workers
on:
  workflow_call:
    inputs:
      working-directory: { type: string, default: "." }
      node-version: { type: string, default: "22" }
      install-command: { type: string, default: "npm ci" }
      build-command: { type: string, default: "" }
      command: { type: string, default: "deploy" }
      # ビルドで使う取得済みデータなどを次回に持ち越したいとき（省略可）。月が変わると保存し直す
      cache-path: { type: string, default: "" }
      cache-key: { type: string, default: "" }
    secrets:
      CLOUDFLARE_API_TOKEN: { required: true }
      CLOUDFLARE_ACCOUNT_ID: { required: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "${{ inputs.node-version }}" }
      - name: 持ち越しデータの月を決める
        id: ym
        if: ${{ inputs.cache-path != '' }}
        run: echo "ym=$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"
      - name: 持ち越しデータを戻す
        if: ${{ inputs.cache-path != '' }}
        uses: actions/cache@v5
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}-${{ steps.ym.outputs.ym }}
          restore-keys: |
            ${{ inputs.cache-key }}-
      - name: 準備
        if: ${{ inputs.install-command != '' && hashFiles(format('{0}/package.json', inputs.working-directory)) != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}
      - name: ビルド
        if: ${{ inputs.build-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}
      - name: 公開
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          command: ${{ inputs.command }}
